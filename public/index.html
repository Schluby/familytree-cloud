<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FamilyTree</title>
  <link rel="stylesheet" href="/css/base.css">
</head>
<body>
<main>
  <h1>FamilyTree</h1>
  <p id="salutation">Chargement…</p>

  <div class="carte">
    <p style="margin-top:0">
      L'interface des arbres arrive au <strong>lot 4</strong>. D'ici là, cette
      page sert à vérifier que votre compte, le Worker et la base se parlent.
    </p>
    <div id="etat" class="technique">interrogation de /api/sante…</div>
    <button id="deconnexion" class="lien" type="button">Se déconnecter</button>
  </div>
</main>

<script type="module">
  import { appeler, compteConnecte } from '/js/identite.js';

  const compte = await compteConnecte();
  if (!compte) {
    window.location.replace('/connexion');
  } else {
    document.getElementById('salutation').textContent =
      `Connecté en tant que ${compte.nom_affiche || compte.email}` +
      (compte.role === 'admin' ? ' (administrateur)' : '');

    const { code, donnees } = await appeler('/api/sante');
    const zone = document.getElementById('etat');
    zone.textContent = `GET /api/sante → ${code}\n${JSON.stringify(donnees, null, 2)}`;

    document.getElementById('deconnexion').addEventListener('click', async () => {
      await appeler('/api/auth/deconnexion', { method: 'POST' });
      window.location.replace('/connexion');
    });
  }
</script>
</body>
</html>
